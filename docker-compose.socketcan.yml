# Run the CAN side on the host's SocketCAN interface vcan0 instead of UDP multicast.
# SocketCAN interfaces live in the host network namespace, hence network_mode: host
# (Linux only). Create the interface first:
#   sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0
services:
  bcm-vecu:
    network_mode: host
    environment:
      CAN_INTERFACE: socketcan
      CAN_CHANNEL: vcan0

  can-provider:
    network_mode: host
    command: ["can_provider.py", "--kuksa", "127.0.0.1:55555"]
    environment:
      CAN_INTERFACE: socketcan
      CAN_CHANNEL: vcan0
